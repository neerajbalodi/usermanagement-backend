# ---------------------------------------------------------------
# Backend server: Java, Maven, pull the code, build the JAR and
# run "java -jar" as a service with DB_HOST pointing at the database.
# Same as Step 3 of the Day 1 handout, but automated.
# ---------------------------------------------------------------
- name: Configure the backend server
  hosts: backend
  become: true
  gather_facts: false

  vars:
    app_dir: /opt/user-management-backend
    jar_path: "{{ app_dir }}/target/user-management-0.0.1-SNAPSHOT.jar"

  pre_tasks:
    - name: Wait for the server
      ansible.builtin.import_tasks: tasks/wait-for-server.yml

  tasks:
    - name: Install Java, Maven and Git
      ansible.builtin.apt:
        name:
          - openjdk-21-jdk-headless
          - maven
          - git
        state: present
        update_cache: true
        lock_timeout: 600

    - name: Create the app folder
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Pull the backend code from Git
      ansible.builtin.git:
        repo: "{{ backend_repo }}"
        dest: "{{ app_dir }}"
        version: "{{ app_branch }}"
        force: true
      become: true
      become_user: "{{ app_user }}"
      register: backend_code

    - name: Check whether the JAR already exists
      ansible.builtin.stat:
        path: "{{ jar_path }}"
      register: backend_jar

    - name: Build the JAR with Maven (first build downloads dependencies, takes a few minutes)
      ansible.builtin.command: mvn -B -q clean package -DskipTests
      args:
        chdir: "{{ app_dir }}"
      become: true
      become_user: "{{ app_user }}"
      when: backend_code.changed or not backend_jar.stat.exists
      changed_when: true
      notify: Restart backend

    - name: Create the config folder
      ansible.builtin.file:
        path: /etc/user-management
        state: directory
        mode: "0755"

    - name: Write the backend settings (where the database is, and the password)
      ansible.builtin.template:
        src: templates/backend.env.j2
        dest: /etc/user-management/backend.env
        mode: "0600"
      notify: Restart backend

    - name: Install the backend as a service (runs java -jar)
      ansible.builtin.template:
        src: templates/user-management-backend.service.j2
        dest: /etc/systemd/system/user-management-backend.service
        mode: "0644"
      notify: Restart backend

    - name: Start the backend and enable it on boot
      ansible.builtin.systemd_service:
        name: user-management-backend
        state: started
        enabled: true
        daemon_reload: true

    - name: Apply changes now
      ansible.builtin.meta: flush_handlers

    - name: Wait for Spring Boot to listen on port 8080
      ansible.builtin.wait_for:
        port: 8080
        timeout: 180

    - name: Check the API answers (this also proves the database connection works)
      ansible.builtin.uri:
        url: http://localhost:8080/api/users
        status_code: 200
      register: api_check
      retries: 12
      delay: 5
      until: api_check.status == 200

  handlers:
    - name: Restart backend
      ansible.builtin.systemd_service:
        name: user-management-backend
        state: restarted
        daemon_reload: true
