spring.application.name=user-management
server.port=8080

# ============================================
# DATABASE (PostgreSQL)
# On EC2, set DB_HOST to the PRIVATE IP of the database instance before starting:
#   export DB_HOST=172.31.x.x
# Defaults below match the Day 1 setup (database userdb, user appuser).
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:appuser123}

# Create / update the USERS table automatically from the User entity
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate runs (useful for learning)
spring.jpa.show-sql=true
