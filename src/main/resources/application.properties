spring.application.name=user-management
server.port=8080

# ============================================
# DATABASE (PostgreSQL)
# On EC2, set DB_HOST to the PRIVATE IP of the database instance before starting:
#   export DB_HOST=172.31.x.x
# Defaults below match the Day 1 setup (database userdb, user appuser).
# ============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:userdb}
spring.datasource.username=${DB_USERNAME:appuser}
spring.datasource.password=${DB_PASSWORD:appuser123}

# Create / update the USERS table automatically from the User entity
spring.jpa.hibernate.ddl-auto=update

# Print the SQL Hibernate runs (useful for learning)
spring.jpa.show-sql=true

# ============================================
# PHOTO UPLOAD (S3) - Day 2
# On EC2 these come from Ansible: S3_BUCKET and AWS_REGION.
# AWS credentials come from the backend EC2's IAM role (no keys in code).
# If S3_BUCKET is empty (e.g. on your laptop) photo upload is switched off.
# ============================================
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-south-1}
app.s3.presigned-url-minutes=60

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ============================================
# CACHE (Redis) - Day 3
# On EC2 Ansible sets CACHE_TYPE=redis, REDIS_HOST and REDIS_PASSWORD.
# On your laptop the default "simple" keeps the cache in memory (no Redis needed).
# ============================================
spring.cache.type=${CACHE_TYPE:simple}
app.cache.ttl-minutes=10

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD:}
# Fail fast if Redis is down, then fall back to the database
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
# We only use Redis as a cache, not for Spring Data repositories
spring.data.redis.repositories.enabled=false
