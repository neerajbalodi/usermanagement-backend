# ---------------------------------------------------------------
# Redis cache inside the cluster (Day 4)
#   Same settings as Day 3: password, 256 MB, remove least-recently-used keys.
#   No disk: a cache may be lost, the app falls back to PostgreSQL.
#   (In production you would usually use Amazon ElastiCache instead.)
# ---------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: user-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - allkeys-lru
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: um-secrets, key: REDIS_PASSWORD }
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 320Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: user-management
spec:
  selector:
    app: redis
  ports:
    - port: 6379
