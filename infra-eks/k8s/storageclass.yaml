# ---------------------------------------------------------------
# Default disk type for the cluster: EBS gp3 (via the EBS CSI driver)
# A PersistentVolumeClaim (e.g. PostgreSQL's) gets a real EBS disk.
# WaitForFirstConsumer: the disk is created in the same AZ as the pod.
# ---------------------------------------------------------------
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
